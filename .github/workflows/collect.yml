name: collect-seoul-data

on:
  schedule:
    # 10분마다 트리거. 실행 중이면 대기(pending)했다가 앞 실행이 끝나는 즉시 이어받는다.
    # 트리거가 한두 번 빠져도 다음 트리거가 이어받기 때문에 수집 공백이 거의 생기지 않는다.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "true: 스케줄 실행처럼 약 50분 연속 수집 (본 수집을 즉시 시작할 때) / false: 1회만 수집 (테스트)"
        type: boolean
        default: false

# 1) 한 번에 하나만 실행한다. 실행 중에 새로 트리거된 실행은 하나만 대기하고
#    (더 새로운 것이 오면 이전 대기분은 취소됨), 앞 실행이 끝나면 바로 시작한다.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write            # 봇이 data/ 를 커밋할 수 있도록

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58      # 2) 수집 약 50분 + 마지막 수집/커밋 여유
    steps:
      - uses: actions/checkout@v4

      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 수집 (5분 간격, 시작 후 약 50분)
        timeout-minutes: 57  # 이 스텝이 시간초과 돼도 아래 always() 스텝은 실행됨
        run: python3 -u collect.py
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          # 수동 실행에서 full=false 이면 1회만 수집하고 끝낸다(테스트). 그 외(스케줄, full=true)는 0(제한 없음)
          MAX_ROUNDS: ${{ github.event_name == 'workflow_dispatch' && !inputs.full && '1' || '0' }}

      # 3) 앞 단계가 실패/취소돼도 지금까지 모은 데이터를 저장
      - name: 최종 커밋
        if: always()
        run: |
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data(final): $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
